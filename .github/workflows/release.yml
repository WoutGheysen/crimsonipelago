name: Build release

# Run manually from the Actions tab to get test builds, or push a tag like v0.1.0
# to also publish them as a GitHub release (marked pre-release until 1.0).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:  # proves packaging changes build on Windows before they merge
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
      - "pyproject.toml"

permissions:
  contents: write

env:
  NATTKH_REF: 96e7f78fcb00d6cb5615171a7f359f0c2de5b114   # the save editor commit reviewed in NOTICE.md
  ASI_LOADER_TAG: v10.0.1

jobs:
  build:
    name: Windows client + APWorld
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui]" pyinstaller

      - name: Build the game plugin (crimsonipelago.asi)
        shell: pwsh
        run: |
          cmake -S plugin -B build/plugin -A x64
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build/plugin --config Release --target crimsonipelago
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Fetch the save editor's decoder (pinned, MPL-2.0, unmodified)
        shell: bash
        run: |
          git init -q "$RUNNER_TEMP/nattkh"
          cd "$RUNNER_TEMP/nattkh"
          git remote add origin https://github.com/NattKh/CRIMSON-DESERT-SAVE-EDITOR-AND-GAME-MODS
          git sparse-checkout set CrimsonSaveEditor
          git fetch -q --depth 1 --filter=blob:none origin "$NATTKH_REF"
          git checkout -q FETCH_HEAD

      - name: Fetch Ultimate ASI Loader (x64, MIT)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo=ThirteenAG/Ultimate-ASI-Loader
          pick() {   # the x64 loader zip of a release: version.dll preferred, dinput8.dll otherwise
            gh release view "$1" -R "$repo" --json assets --jq '.assets[].name' > assets.txt || return 1
            { echo "assets of $1:"; cat assets.txt; } >&2
            grep -iE '^version[-_]?x64.*\.zip$' assets.txt | head -1 || true
            grep -iE '^dinput8[-_]?x64.*\.zip$' assets.txt | head -1 || true
          }
          tag="$ASI_LOADER_TAG"
          asset=$(pick "$tag" | grep -iE '\.zip$' | head -1)
          if [ -z "$asset" ]; then tag=x64-latest; asset=$(pick "$tag" | grep -iE '\.zip$' | head -1); fi
          [ -n "$asset" ] || { echo "::error::no x64 loader zip found"; exit 1; }
          echo "using $asset from $tag"
          gh release download "$tag" -R "$repo" -p "$asset" -O loader.zip
          gh api "repos/$repo/license" --jq .content | base64 -d > loader-license.txt
          echo "ASI_LOADER_USED=$tag/$asset" >> "$GITHUB_ENV"

      - name: Gather bundled files
        shell: bash
        run: |
          python packaging/fetch_bundled.py \
            --editor "$RUNNER_TEMP/nattkh/CrimsonSaveEditor" --editor-license "$RUNNER_TEMP/nattkh/LICENSE.txt" \
            --editor-commit "$NATTKH_REF" --plugin build/plugin/Release/crimsonipelago.asi \
            --loader-zip loader.zip --loader-license loader-license.txt --loader-version "$ASI_LOADER_USED"

      - name: Build CrimsonipelagoClient.exe
        run: pyinstaller --noconfirm --clean packaging/crimsonipelago.spec

      - name: Build crimson_desert.apworld
        run: crimson-build-apworld -o dist/crimson_desert.apworld

      - name: Smoke-test the exe
        shell: bash
        run: |
          ./dist/CrimsonipelagoClient.exe --version
          ./dist/CrimsonipelagoClient.exe --data-dir smoke sim init
          ./dist/CrimsonipelagoClient.exe --data-dir smoke sim complete "Unfamiliar Lands: Head to the cabin"
          ./dist/CrimsonipelagoClient.exe --data-dir smoke sim show
          ./dist/CrimsonipelagoClient.exe --data-dir smoke bundled

      - name: Assemble release folder
        shell: bash
        run: |
          mkdir -p release
          cp dist/CrimsonipelagoClient.exe dist/crimson_desert.apworld release/
          cp examples/player.yaml "release/Crimson Desert.yaml"
          cp README.md LICENSE NOTICE.md docs/setup.md docs/troubleshooting.md docs/hosting.md release/
          cp build/bundled/SOURCES.txt release/BUNDLED-SOURCES.txt

      - uses: actions/upload-artifact@v4
        with:
          name: crimsonipelago-windows
          path: release/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v1') }}
          files: release/*
