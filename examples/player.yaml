# Crimson Desert player options for Archipelago.
# Rename this file (e.g. Wout.yaml) and put it in Archipelago's Players folder.
# The full template with every common option is available from the Archipelago
# Launcher: "Generate Template Options".
#
# NOTE: Crimsonipelago is pre-alpha. The world still uses a PLACEHOLDER
# catalogue: seeds generate, but no check or item maps to real game data yet.

name: Player{number}          # your slot name, max 16 characters
description: Crimson Desert (Crimsonipelago)
game: Crimson Desert
requires:
  version: 0.6.7              # minimum Archipelago version

Crimson Desert:
  # Archipelago's standard settings
  progression_balancing: 50   # 0-99, higher = progression found earlier
  accessibility: full         # full: every location reachable; minimal: only what the goal needs

  # Victory condition. Only goals with reliable in-game detection are offered.
  goal: main_story

  # conservative: fewer unlocks shuffled, safe ones given at the start (gentler seed)
  # expanded: every supported unlock goes into the multiworld
  item_pool_mode: expanded

  # Which kinds of activities count as checks. Removing categories shortens the seed.
  included_check_categories:
    - quest
    - boss
    - discovery
    - treasure
    - ability
    - exploration
